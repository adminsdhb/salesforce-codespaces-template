name: Validate template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config/openspec-version.txt

      - name: Resolve OpenSpec version
        run: echo "OPENSPEC_VERSION=$(tr -d '[:space:]' < config/openspec-version.txt)" >> "$GITHUB_ENV"

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@${OPENSPEC_VERSION}

      - name: Validate project files
        run: bash scripts/validate.sh

      - name: Validate shell syntax
        run: bash -n .devcontainer/post-create.sh scripts/setup.sh scripts/validate.sh
