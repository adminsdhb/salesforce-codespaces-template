name: Validate template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.12.0

      - name: Validate project files
        run: bash scripts/validate.sh

      - name: Validate shell syntax
        run: bash -n .devcontainer/post-create.sh scripts/setup.sh scripts/validate.sh
