schema: spec-driven
githubCopilot:
  cloudAgent: false
context: |
  Repository type: reusable GitHub Codespaces template for Salesforce DX projects.
  Tooling: Node.js 22 dev container, Salesforce CLI, jq, Bash helper scripts, and OpenSpec.
  Safety requirements: never add org credentials, auth URLs, certificates, usernames, passwords, tokens, or other secrets to the repository.
  Repository changes should stay template-agnostic and update documentation plus validation when template behavior changes.
  Non-trivial changes should begin with OpenSpec planning and keep the resulting openspec artifacts in version control.
rules:
  proposal:
    - Keep the change scoped to reusable template behavior.
    - Call out any validation, documentation, or developer workflow impact.
  specs:
    - Use SHALL statements with concrete contributor-facing scenarios.
    - Capture template behavior, not project-specific org behavior.
  tasks:
    - Include documentation and validation updates when repository behavior changes.
operations:
  apply:
    guidance:
      - Keep changes small and repository-scoped.
      - Update scripts or workflow validation when new required repository files are introduced.
  archive:
    guidance:
      - Confirm the relevant main specs reflect the shipped repository behavior before archiving.
